$kind: http-request
description: ""
url: "{{baseUrl}}/api/usuaris/refresh"
method: POST
body:
  type: json
  content: '   { "refreshToken": "{{refreshToken}}" }'
scripts:
  - type: afterResponse
    code: "   pm.test(\"Status code is 200\", () => pm.response.to.have.status(200));\r

      \   const d = pm.response.json().data;\r

      \   pm.environment.set(\"refreshAntic\", pm.environment.get(\"refreshToken\"));\r

      \   pm.environment.set(\"accessToken\", d.accessToken);\r

      \   pm.environment.set(\"refreshToken\", d.refreshToken);"
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
order: 19000
